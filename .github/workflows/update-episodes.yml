name: update episodes
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_episodes.py index.html
      - run: |
          git config user.name "episode bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "update episodes from rss" && git push)
